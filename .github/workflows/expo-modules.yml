name: Expo modules native release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-modules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  watchos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: ./.github/actions/setup
      - name: Verify toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          swift --version
          pod --version
      - name: Select watch simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/watch-devices.json"
          node - <<'JS'
          const fs = require('node:fs');
          const inventory = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/watch-devices.json', 'utf8'));
          const device = Object.entries(inventory.devices).filter(([runtime]) => runtime.includes('.watchOS-')).flatMap(([, devices]) => devices).find(device => device.isAvailable !== false);
          if (!device) throw new Error('No watchOS simulator runtime is available on this runner.');
          fs.appendFileSync(process.env.GITHUB_ENV, `RNW_EXPO_SIMULATOR_UDID=${device.udid}\n`);
          JS
      - name: Test native JS thread lifecycle
        run: node --test tests/js-thread.test.mjs
      - name: Build and exercise Expo runtime
        run: pnpm test:expo-modules
      - name: Exercise embedded scripts in Hermes
        run: |
          slice="$PWD/build/xcframework/ReactNativeWatchOSCxx.xcframework/watchos-arm64-simulator"
          hermes="$PWD/build/xcframework/hermes.xcframework/watchos-arm64-simulator"
          binary="$RUNNER_TEMP/rnw-native-runtime"
          xcrun --sdk watchsimulator clang++ -std=c++20 -fobjc-arc \
            -target arm64-apple-watchos9.4-simulator \
            -isysroot "$(xcrun --sdk watchsimulator --show-sdk-path)" \
            -I"$slice/Headers" -Iapple/Sources/ReactNativeWatchOSCxx \
            tests/native-runtime.integration.mm -L"$slice" -lReactNativeWatchOSCxx \
            -F"$hermes" -framework hermes -framework Foundation -framework Security \
            -licucore -Wl,-rpath,"$hermes" -o "$binary"
          codesign --force --sign - "$binary"
          xcrun simctl spawn "$RNW_EXPO_SIMULATOR_UDID" "$binary"
      - name: Build both watch device architectures
        run: ./poc/expo-smoke/run.sh device
      - name: Verify the published package in a fresh Expo app
        run: node scripts/test-expo-consumer.cjs all
      - name: Verify the adjacent supported Expo patch
        run: node scripts/test-expo-consumer.cjs all --expo-version 57.0.19 --workdir build/test-expo-consumer-57.0.19
      - name: Preserve native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expo-modules-native-results
          path: |
            build/poc/expo-smoke/result.json
            build/poc/expo-smoke/logs/
            build/test-expo-consumer/logs/
            build/test-expo-consumer/result.json
            build/test-expo-consumer-57.0.19/logs/
            build/test-expo-consumer-57.0.19/result.json
          if-no-files-found: warn
